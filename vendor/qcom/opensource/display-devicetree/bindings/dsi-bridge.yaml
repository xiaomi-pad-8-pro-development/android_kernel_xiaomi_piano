%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/dsi-bridge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm DSI Bridge

description: |
  Qualcomm DSI bridge devices that connect to a DSI controller.
  This includes simulation bridges for testing and physical bridge
  implementations.

maintainers:
  - Yahui Wang <yahuiw@qti.qualcomm.com>

properties:
  compatible:
    enum:
      - qcom,dsi-sim-bridge

  reg:
    maxItems: 1
    description: I2C slave address of the bridge device

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description: |
      A port graph binding as defined in
      Documentation/devicetree/bindings/graph.txt to describe
      the connections between the DSI controller and the bridge.

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: |
          Video port for DSI input. The remote endpoint phandle
          should point to the DSI controller's output port.

    required:
      - port@0

required:
  - compatible
  - reg
  - ports

additionalProperties: false

examples:
  - |
    i2c@a88000 {
        #address-cells = <1>;
        #size-cells = <0>;

        dsi-bridge@1c {
            compatible = "qcom,dsi-sim-bridge";
            reg = <0x1c>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    dsi_bridge_in: endpoint {
                        remote-endpoint = <&dsi_out>;
                    };
                };
            };
        };
    };
...
